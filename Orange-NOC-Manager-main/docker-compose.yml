services:
  postgres:
    image: postgres:16-alpine
    container_name: orange-noc-postgres
    environment:
      POSTGRES_DB: orange_noc
      POSTGRES_USER: orange
      POSTGRES_PASSWORD: orange
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orange -d orange_noc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: orange-noc-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://orange:orange@postgres:5432/orange_noc
      CLIENT_DIST_PATH: /app/client/dist
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
